name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Lua syntax, the tests on a fake WoW client, and the TOC.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lua 5.1 and luacheck
        run: sudo apt-get install -y lua5.1 lua-check > /dev/null

      - name: Lua syntax
        run: for f in Gulli-*/*.lua tests/*/*.lua; do luac5.1 -p "$f"; done

      - name: Names and GUIDs of other units are checked for secret values
        run: lua5.1 tools/ci/secret_units.lua Gulli-*/*.lua

      - name: Tests on a fake WoW client
        run: |
          rc=0
          for t in tests/*/test.lua; do echo "== $t"; lua5.1 "$t" || rc=1; done
          exit $rc

      - name: Lint (luacheck, only the warnings that are bugs)
        run: python3 tools/lint/luacheck.py

      - name: Client API (events and functions the retail client has)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/Gethe/wow-ui-source /tmp/wus
          git -C /tmp/wus sparse-checkout set Interface/AddOns/Blizzard_APIDocumentationGenerated
          echo "Client build: $(git -C /tmp/wus log -1 --format=%s)"
          python3 tools/apicheck/check.py /tmp/wus/Interface/AddOns/Blizzard_APIDocumentationGenerated

      - name: Every module has the same Skin.lua and Media as the core
        run: |
          rc=0
          for f in Gulli-*/Skin.lua; do
            cmp -s Gulli-Toolkit/Skin.lua "$f" || { echo "::error::$f differs from Gulli-Toolkit/Skin.lua. Run tools/skin/sync.sh."; rc=1; }
            d=$(dirname "$f")
            diff -r Gulli-Toolkit/Media "$d/Media" >/dev/null || { echo "::error::$d/Media differs from Gulli-Toolkit/Media. Run tools/skin/sync.sh."; rc=1; }
          done
          exit $rc

      - name: On/off settings are switches, not Yes/No buttons
        run: |
          if grep -nE '\{ *(true, *false|false, *true) *\}|L\.(YES|NO)\b' Gulli-*/UI.lua; then
            echo "Use S.SwitchRow or S.SwitchLabel for an on/off setting (AGENTS.md, Working conventions)."
            exit 1
          fi

      - name: The addons do not name Runeloader
        run: |
          if grep -rniI 'runeloader' Gulli-*/; then
            echo "::error::Do not name Runeloader inside the addons (AGENTS.md, Working conventions)."
            exit 1
          fi

      - name: BagSpace has the same Junk.lua as Merchant
        run: |
          cmp -s Gulli-Merchant/Junk.lua Gulli-BagSpace/Junk.lua || { echo "::error::Gulli-BagSpace/Junk.lua differs from Gulli-Merchant/Junk.lua. Run tools/junk/sync.sh."; exit 1; }

      - name: Each addon folder has a Forever TOC that lists every Lua file
        run: |
          for dir in Gulli-*/; do
            name=${dir%/}
            toc="$dir$name.toc"
            [ -f "$toc" ] || { echo "::error::$toc is missing"; exit 1; }
            grep -q '^## Interface: 160' "$toc" || { echo "::error::$toc has no ## Interface: 160xx"; exit 1; }
            grep -qE '^## Version: [0-9]+\.[0-9]+\.[0-9]+' "$toc" || { echo "::error::$toc has no ## Version: x.y.z"; exit 1; }
            if [ "$name" != "Gulli-Toolkit" ]; then
              grep -q '^## X-Gulli-Module: ' "$toc" || { echo "::error::$toc has no ## X-Gulli-Module"; exit 1; }
              grep -q '^## OptionalDeps:.*Gulli-Toolkit' "$toc" || { echo "::error::$toc does not list Gulli-Toolkit in ## OptionalDeps"; exit 1; }
              [ -d "tests/$(echo "${name#Gulli-}" | tr 'A-Z' 'a-z')" ] || { echo "::error::$name has no tests/<module> folder"; exit 1; }
            fi
            for f in "$dir"*.lua; do
              grep -qx "$(basename "$f")" "$toc" || { echo "::error::$f is not listed in $toc"; exit 1; }
            done
          done

  # Branch names follow AGENTS.md: feature/<name> or bugfix/<name>.
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Branch name follows AGENTS.md
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == dependabot/* ]]; then exit 0; fi
          if [[ ! "$HEAD_REF" =~ ^(feature|bugfix)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch '$HEAD_REF' must be feature/<name> or bugfix/<name> (lowercase words joined by hyphens). See AGENTS.md."
            exit 1
          fi
          case "$HEAD_REF" in
            */patch|*/update|*/project-thread) echo "::error::Branch '$HEAD_REF' has a generic name. Name the task."; exit 1 ;;
          esac
