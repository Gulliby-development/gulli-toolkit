name: CurseForge

# Uploads to CurseForge (tools/curseforge/upload.py): a module with its own project gets its zip
# after each of its releases (Release calls this). The core and the small modules go into the
# Gulli Toolkit project as one zip of the newest releases, uploaded by the hourly run only when
# one of them was released since, so a batch makes one file and no duplicate. "Run workflow"
# with a tag uploads it at once, "all" every project. Without CF_API_TOKEN or an id it does nothing.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "A release tag (Core-v1.17.0, CraftProfit-v1.9.0) or all"
        required: true
        default: all
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read
  actions: read   # the hourly run reads when it last succeeded

jobs:
  # One queue per CurseForge project (upload.py --route): a batch of releases never drops a
  # module's upload.
  route:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.route.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: route
        env:
          TAG: ${{ inputs.tag || 'hourly' }}
        run: echo "project=$(python3 tools/curseforge/upload.py --route "$TAG")" >> "$GITHUB_OUTPUT"

  upload:
    needs: route
    runs-on: ubuntu-latest
    concurrency:
      group: curseforge-${{ needs.route.outputs.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || 'hourly' }}
          FROM_RELEASE: ${{ github.workflow == 'Release' && '1' || '' }}
        run: python3 tools/curseforge/upload.py "$REPO" "$TAG"
