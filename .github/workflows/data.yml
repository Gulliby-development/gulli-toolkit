name: Game data

# Every week: rebuild the Data.lua files from the newest QuestieDB and Skillet-Classic. When one
# changed, push a branch, open a pull request and run CI on it (a pull request opened by the
# Actions token starts no workflow by itself). The Attune chains are checked too.
on:
  schedule:
    - cron: "30 4 * * 1"   # Mondays, 04:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sources
        run: |
          git clone -q --depth 1 https://github.com/Questie/QuestieDB /tmp/questiedb
          curl -sSfL -o /tmp/SkillLevelData1.lua https://raw.githubusercontent.com/b-morgan/Skillet-Classic/master/SkillLevelData1.lua
          echo "QUESTIEDB=$(git -C /tmp/questiedb log -1 --format='%h %cs')" >> "$GITHUB_ENV"

      - name: Rebuild Data.lua
        run: |
          python3 tools/questcleaner/build_data.py /tmp/questiedb
          python3 tools/dungeonprep/build_data.py /tmp/questiedb
          python3 tools/mobfinder/build_data.py /tmp/questiedb
          python3 tools/craftprofit/build_data.py /tmp/SkillLevelData1.lua /tmp/questiedb

      - name: Attune chains against the data
        id: attune
        run: |
          set +e
          python3 tools/attune/check_data.py /tmp/questiedb | tee attune.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Tests on the new data
        run: |
          sudo apt-get install -y lua5.1 > /dev/null
          rc=0
          for t in tests/*/test.lua; do lua5.1 "$t" > /dev/null || { echo "::error::$t failed"; rc=1; }; done
          exit $rc

      - name: Pull request when the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "The data did not change."; exit 0; fi
          changed=$(git diff --name-only | tr '\n' ' ')
          branch="feature/game-data-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -qam "Game data from QuestieDB $QUESTIEDB"
          git push -q origin "$branch"
          body="The weekly data job rebuilt Data.lua from QuestieDB $QUESTIEDB and Skillet-Classic. Changed: $changed. Bump the version of each changed module in this pull request before you merge, then release them."
          if ! gh pr create --base main --head "$branch" --title "Game data from QuestieDB $QUESTIEDB" --body "$body"; then
            gh issue create --title "Game data changed (QuestieDB $QUESTIEDB)" --body "Priority: P1

          $body The branch is $branch; open the pull request by hand (Actions may not open pull requests here)."
          fi
          gh workflow run ci.yml --ref "$branch"

      - name: Issue when an Attune step is gone or renamed
        if: steps.attune.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Priority: P1"; echo; echo "\`tools/attune/check_data.py\` against QuestieDB $QUESTIEDB:"; echo; echo '```'; cat attune.txt; echo '```'; } > body.md
          gh issue create --title "Attune: a step no longer matches QuestieDB" --body-file body.md
